[project]
name = "esp32oled-ci"
version = "0.1.0"
description = "Firmware acquisition and verification client for ESP32-C3 deployments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
esp32oled-ci = "esp32oled_ci.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp32oled_ci"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "A"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
